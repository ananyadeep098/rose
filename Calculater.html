<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
<style>
    header {
    background-color: rgb(3, 18, 108);
    color: antiquewhite;
    text-align: center;
    padding: 14px;
}


body {
    background-color: rgb(209, 212, 233);
    font-family: Cambria, Georgia, 'Times New Roman', serif;
}

h2 {
    text-align: center;
    padding: 5px;
    font-size: 22px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-color: antiquewhite;
    box-sizing: border-box;
}

button {
    width: 100%;
    height: 40px;
    border-radius: 5px;
    border-color: blue;
    background: #1512e4;
    color: antiquewhite;
    font-size: 20px;
    font-weight: bolder;
    text-align: center;
    cursor: pointer;
    box-shadow: 0px 12px 15px rgba(0, 0, 0, 0.3);
}

button + button {
    margin-top: 10px;
}

.card {
    background: white;
    margin: 40px auto;
    border-radius: 20px;
    max-width: 300px;
    padding: 20px;
    box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.3);
}

#msg {
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>
    <header>
        <h1>Simple Calculator</h1>
    </header>

    <div class="card">
        <h2>Calculator</h2>
        <form id="calcForm">
            <input type="number" id="num1" placeholder="Enter First Number">
            <input type="number" id="num2" placeholder="Enter Second Number">
            <select id="operator">
                <option value="">Select Operation</option>
                <option value="add">Addition (+)</option>
                <option value="sub">Subtraction (-)</option>
                <option value="mul">Multiplication (*)</option>
                <option value="div">Division (/)</option>
            </select>
            <button type="submit">Calculate</button>
            <button type="button" onclick="clearForm()">Clear</button>
        </form>
        <p id="msg"></p>
    </div>

    <script>
        document.getElementById("calcForm").addEventListener("submit", function (e) {
            e.preventDefault();

  var num1 = document.getElementById("num1").value.trim();
  var num2 = document.getElementById("num2").value.trim();
  var operator = document.getElementById("operator").value;
  var msg = document.getElementById("msg");
  var a = Number(num1);
  var b = Number(num2);
  var result;

  msg.style.color = "red";

  if (num1 === "" || num2 === "") {
    msg.innerHTML = "Both numbers cannot be empty.";
  } else if (operator === "") {
    msg.innerHTML = "Please select an operation.";
  } else if (operator === "div" && b === 0) {
    msg.innerHTML = "Cannot divide by zero.";
  } else {
    if (operator === "add") {
      result = a + b;
    } else if (operator === "sub") {
      result = a - b;
    } else if (operator === "mul") {
      result = a * b;
    } else {
      result = a / b;
    }
    msg.style.color = "green";
    console.log("Calculation Details:");
    console.log(a, operator, b, result);
    msg.innerHTML = "&#10004; Result: " + result;
  }
});

function clearForm() {
  document.getElementById("calcForm").reset();
  document.getElementById("msg").innerHTML = "";
}
</script>
</body>
</html>
